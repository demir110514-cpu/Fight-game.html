<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Арена монет</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#150f26;--card:#251a42;--gold:#ffc233;--red:#ff4d6d;--ink:#f6efff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1,h2,h3,button,.rf{font-family:"Russo One",Impact,sans-serif;font-weight:400}
.scr{display:none;flex-direction:column;align-items:center;gap:12px;padding:20px 14px;max-width:760px;margin:0 auto;text-align:center}
.scr.on{display:flex}
h1{font-size:clamp(34px,9vw,56px);margin:8px 0 0;line-height:1.05;color:var(--gold)}
.sub{margin:0;opacity:.8}
.coin{font-family:"Russo One",sans-serif;font-size:22px;color:var(--gold)}
button{font-size:17px;border:0;border-radius:10px;padding:12px 18px;background:#3a2a66;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold)}
button.big{width:min(320px,100%);font-size:20px;background:var(--red)}
button.alt{background:var(--gold);color:#2a1a00}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.row button.on{background:var(--gold);color:#2a1a00}
.hint{font-size:13px;opacity:.65;max-width:420px;margin:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.card{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;cursor:pointer;border:2px solid transparent}
.card:hover{border-color:var(--gold)}
.card b{font-size:38px}.card h3{margin:0;font-size:17px}.card small{opacity:.7;font-size:12px}
.card.lock b,.card.lock h3{opacity:.45}
.card em{font-style:normal;color:#4ade80;font-size:14px}
.card button{font-size:14px;padding:8px 10px;background:var(--gold);color:#2a1a00}
.bar{display:flex;align-items:center;gap:6px;width:100%;font-size:11px}
.bar i{width:34px;text-align:left;font-style:normal;opacity:.7}
.bar u{display:block;height:6px;border-radius:3px;background:var(--red)}
.bar{background:linear-gradient(#0003,#0003) 40px 50%/calc(100% - 40px) 6px no-repeat}
#stage{display:none;position:fixed;inset:0;background:#000;z-index:5}
#cv{width:100%;height:100%;display:block;object-fit:contain;background:#000}
#bk{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 10px;opacity:.7}
#tc{display:none;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;padding:10px calc(14px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));touch-action:none;pointer-events:none}
#tc div{display:flex;gap:10px}
#tc button{pointer-events:auto;width:62px;height:62px;font-size:22px;padding:0;border-radius:50%;background:#3a2a66b3;border:2px solid #fff3}
#tc button:active{background:var(--gold)}
@media(pointer:coarse){#tc{display:flex}}
#rot{display:none;position:absolute;inset:0;background:#150f26;color:var(--gold);flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:"Russo One",sans-serif;font-size:22px;text-align:center;z-index:9;padding:20px}
#rot span{font-size:56px}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style></head><body>

<div id="menu" class="scr on">
<h1>Арена монет</h1>
<p class="sub">Побеждай, копи монеты и открывай новых бойцов</p>
<div class="coin">🪙 <span class="cn"></span></div>
<div class="row"><span>Сложность</span><button class="d" data-d="0">Лёгкая</button><button class="d on" data-d="1">Средняя</button><button class="d" data-d="2">Сложная</button></div>
<button class="big" onclick="go('ai')">Бой с ИИ</button>
<button class="big" onclick="go('2p')">Два игрока</button>
<button class="big alt" onclick="sel('shop')">Магазин бойцов</button>
<p class="hint">Игрок 1: A и D — ходьба, W — прыжок, S — блок, J — быстрый удар, K — сильный, L — спецприём. Игрок 2: стрелки и клавиши 1, 2, 3. На телефоне пользуйся кнопками под экраном боя.</p>
</div>

<div id="sel" class="scr">
<div class="coin">🪙 <span class="cn"></span></div>
<h2 id="st" style="margin:0"></h2>
<div id="grid"></div>
<button onclick="show('menu')">Назад в меню</button>
</div>

<div id="res" class="scr">
<h1 id="rt"></h1><p id="rs" class="sub"></p>
<div class="coin">🪙 <span class="cn"></span></div>
<button class="big" onclick="startMatch()">Ещё раз</button>
<button class="big alt" onclick="sel('shop')">Магазин бойцов</button>
<button onclick="show('menu')">В меню</button>
</div>

<div id="stage">
<canvas id="cv" width="800" height="420"></canvas>
<div id="rot"><span>📱↻</span>Поверни телефон горизонтально</div>
<button id="bk" onclick="stop();show('menu')">Выйти</button>
<div id="tc"><div><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="u">▲</button></div><div><button data-k="d">🛡</button><button data-k="a">👊</button><button data-k="b">💥</button><button data-k="s">✨</button></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const C=[
{n:'Новичок',e:'🥋',c:'#4aa3ff',hp:100,sp:1,pw:1,df:1,pr:0,sk:'proj',sn:'Шар ци'},
{n:'Ниндзя',e:'🥷',c:'#505a78',hp:85,sp:1.5,pw:.9,df:.9,pr:100,sk:'dash',sn:'Теневой рывок'},
{n:'Самурай',e:'⚔️',c:'#d94f4f',hp:100,sp:1.1,pw:1.15,df:1,pr:200,sk:'reach',sn:'Выпад мечом'},
{n:'Тяжеловес',e:'🪨',c:'#8a6d4b',hp:140,sp:.7,pw:1.4,df:1.3,pr:300,sk:'wave',sn:'Ударная волна'},
{n:'Маг',e:'🧙',c:'#9b5de5',hp:80,sp:1,pw:1,df:.8,pr:450,sk:'proj',sn:'Огненный шар',pc:'#ff8a3d'},
{n:'Робот',e:'🤖',c:'#7a8ba3',hp:110,sp:.9,pw:1.1,df:1.4,pr:600,sk:'laser',sn:'Лазер'},
{n:'Боксёр',e:'🥊',c:'#e63946',hp:105,sp:1.3,pw:1.1,df:1,pr:800,sk:'reach',sn:'Серия ударов'},
{n:'Дракон',e:'🐉',c:'#2fbf71',hp:110,sp:1,pw:1.25,df:1.1,pr:1000,sk:'proj',sn:'Дыхание огня',pc:'#ff5d2e',big:1},
{n:'Призрак',e:'👻',c:'#9aa5ff',hp:90,sp:1.2,pw:1,df:1,pr:1200,sk:'ghost',sn:'Фантом'},
{n:'Король',e:'👑',c:'#ffc233',hp:130,sp:1.1,pw:1.35,df:1.3,pr:1500,sk:'wave',sn:'Королевский гнев'}];

let S=null;try{S=JSON.parse(localStorage.getItem('arena1'))}catch(e){}
if(!S||!S.o)S={coins:0,o:[0]};
const save=()=>{try{localStorage.setItem('arena1',JSON.stringify(S))}catch(e){}};
const upc=()=>document.querySelectorAll('.cn').forEach(e=>e.textContent=S.coins);
let mode='ai',diff=1,p1c=0,p2c=0,pick=1,selM='fight',scr='menu';
function show(id){scr=id;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));$('#stage').style.display=id=='game'?'block':'none';upc()}
document.querySelectorAll('.d').forEach(b=>b.onclick=()=>{diff=+b.dataset.d;document.querySelectorAll('.d').forEach(o=>o.classList.toggle('on',o==b))});
const go=m=>{mode=m;sel('fight')};
function sel(m){selM=m;pick=1;show('sel');rs()}
const bar=(l,v)=>`<div class="bar"><i>${l}</i><u style="width:${Math.min(100,v*100)}%"></u></div>`;
function rs(){
 upc();$('#st').textContent=selM=='shop'?'Магазин бойцов':'Выбери бойца: игрок '+pick;
 $('#grid').innerHTML=C.map((c,i)=>{const o=S.o.includes(i);return `<div class="card ${o?'':'lock'}" data-i="${i}"><b>${o?c.e:'🔒'}</b><h3>${c.n}</h3>${bar('Скор.',c.sp/1.5)}${bar('Сила',c.pw/1.4)}${bar('Защ.',c.df/1.4)}<small>${c.sn}</small>${o?'<em>Открыт</em>':`<button data-b="${i}" ${S.coins<c.pr?'disabled':''}>Купить 🪙${c.pr}</button>`}</div>`}).join('')}
$('#grid').onclick=e=>{
 const b=e.target.closest('[data-b]');
 if(b){const i=+b.dataset.b;if(S.coins>=C[i].pr&&!S.o.includes(i)){S.coins-=C[i].pr;S.o.push(i);save();rs()}return}
 const c=e.target.closest('.card');if(!c||selM!='fight')return;
 const i=+c.dataset.i;if(!S.o.includes(i))return;
 if(pick==1){p1c=i;if(mode=='2p'){pick=2;rs();return}}else p2c=i;
 startMatch()};

/* ---------- бой ---------- */
const cv=$('#cv'),x=cv.getContext('2d'),W=800,H=420,G=350;
let F=[],PR=[],FX=[],wins,round,tm,phase,pt,wn,lost,cmb,arena,shake=0,raf;
const K=[0,1].map(()=>({l:0,r:0,u:0,d:0,a:0,b:0,s:0,pa:0,pb:0,ps:0}));
const KM=[{KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d',KeyJ:'a',KeyK:'b',KeyL:'s'},{ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Digit1:'a',Digit2:'b',Digit3:'s'}];
onkeydown=e=>KM.forEach((m,i)=>{const k=m[e.code];if(k&&scr=='game'){K[i][k]=1;if('abs'.includes(k))K[i]['p'+k]=1;e.preventDefault()}});
onkeyup=e=>KM.forEach((m,i)=>{const k=m[e.code];if(k)K[i][k]=0});
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k;
 b.onpointerdown=e=>{e.preventDefault();K[0][k]=1;if('abs'.includes(k))K[0]['p'+k]=1};
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[0][k]=0))});

const mk=(ci,px,dir)=>({ci,c:C[ci],x:px,y:G,vy:0,vx:0,dir,hp:C[ci].hp,mh:C[ci].hp,en:0,at:0,ak:'',hf:-1,hs:0,bl:0,gh:0,cd:0,blk:0,cb:0,cbt:0});
function startMatch(){
 const r=Math.floor(Math.random()*C.length);
 F=[mk(p1c,200,1),mk(mode=='ai'?r:p2c,600,-1)];
 wins=[0,0];round=1;lost=false;cmb=0;arena=Math.floor(Math.random()*3);
 show('game');
 if(matchMedia('(pointer:coarse)').matches){try{const de=document.documentElement;(de.requestFullscreen?de.requestFullscreen():Promise.reject()).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
 newRound();stop();loop()}
function newRound(){F=[mk(F[0].ci,200,1),mk(F[1].ci,600,-1)];PR=[];FX=[];tm=3600;phase='ready';pt=80}
const stop=()=>cancelAnimationFrame(raf);
function loop(){if(scr!='game')return;step();draw();raf=requestAnimationFrame(loop)}

function begin(f,t){
 f.ak=t;
 if(t=='l'){f.at=14;f.hf=7}
 else if(t=='h'){f.at=26;f.hf=12}
 else{f.en-=50;const s=f.c.sk;
  if(s=='ghost'){f.gh=130;f.at=10;f.hf=-1}
  else if(s=='dash'){f.at=22;f.hf=14;f.vx=f.dir*14}
  else if(s=='reach'){f.at=24;f.hf=11}
  else{f.at=22;f.hf=10}}}
function strike(f,o){
 const c=f.c,a=f.ak;
 if(a=='s'&&['proj','wave','laser'].includes(c.sk)){
  const w=c.sk=='wave',l=c.sk=='laser';
  PR.push({x:f.x+f.dir*30,y:f.y-(w?30:60),vx:f.dir*(l?16:w?5:9),d:(w?20:l?10:15)*c.pw,r:w?28:c.big?20:12,o:f,c:c.pc||(w?'#ffd166':l?'#7df9ff':'#8cf')});return}
 const d={l:6,h:13,s:18}[a]*c.pw,rc=a=='s'?(c.sk=='reach'?125:85):a=='h'?72:60;
 const dx=(o.x-f.x)*f.dir;
 if(dx>-10&&dx<rc&&Math.abs(o.y-f.y)<70)hurt(o,f,(f.gh>0?1.5:1)*d,a=='l'?5:10)}
function hurt(o,f,d,kb){
 if(o.gh>0)return;
 if(o.bl){d*=.15/o.c.df;kb*=.3;spark(o.x,o.y-55,'#9ef')}
 else{d/=o.c.df;o.hs=d>10?18:11;o.at=0;f.cb++;f.cbt=70;f.en=Math.min(100,f.en+8);shake=d>10?9:4;spark(o.x,o.y-55,'#ffd166');
  if(f.cb==3&&f===F[0]&&cmb<5)cmb++}
 o.hp-=d;o.vx=f.dir*kb}
function spark(px,py,c){for(let i=0;i<9;i++)FX.push({x:px,y:py,vx:(Math.random()-.5)*8,vy:(Math.random()-.8)*6,l:20,c})}

function upd(f,o,k){
 f.dir=o.x>f.x?1:-1;
 if(f.gh>0)f.gh--;
 if(f.cbt>0)f.cbt--;else f.cb=0;
 f.en=Math.min(100,f.en+.09);
 f.vy+=.8;f.y+=f.vy;if(f.y>=G){f.y=G;f.vy=0}
 f.x+=f.vx;f.vx*=.85;f.bl=0;
 const air=f.y<G;
 if(f.hs>0)f.hs--;
 else if(f.at>0){f.at--;if(f.at==f.hf)strike(f,o)}
 else{
  if(k.d&&!air)f.bl=1;
  else{f.x+=(k.r-k.l)*4*f.c.sp;if(k.u&&!air)f.vy=-14}
  if(k.pa)begin(f,'l');else if(k.pb)begin(f,'h');else if(k.ps&&f.en>=50)begin(f,'s')}
 k.pa=k.pb=k.ps=0;
 f.x=Math.max(30,Math.min(W-30,f.x))}
function prj(){
 PR=PR.filter(p=>{p.x+=p.vx;const t=p.o===F[0]?F[1]:F[0];
  if(Math.abs(p.x-t.x)<p.r+20&&p.y>t.y-95&&p.y<t.y+10){hurt(t,p.o,p.d,7);return false}
  return p.x>-40&&p.x<W+40})}
function ai(f,o,k){
 k.l=k.r=k.u=k.d=k.pa=k.pb=k.ps=0;
 const dist=Math.abs(o.x-f.x),dir=o.x>f.x?1:-1,lv=[.5,.8,1.1][diff];
 if(f.cd>0)f.cd--;
 if(f.blk<=0&&(o.at>0||PR.some(p=>p.o!==f&&Math.abs(p.x-f.x)<150))&&Math.random()<.05*lv)f.blk=16;
 if(f.blk>0){f.blk--;k.d=1;return}
 if(dist>85){if(dir>0)k.r=1;else k.l=1}
 else if(dist<50&&Math.random()<.02){if(dir>0)k.l=1;else k.r=1}
 if(f.cd==0){
  if(f.en>=50&&Math.random()<.025*lv){k.ps=1;f.cd=50}
  else if(dist<80&&Math.random()<.06*lv){Math.random()<.65?k.pa=1:k.pb=1;f.cd=Math.round(28/lv)}}
 if(Math.random()<.004)k.u=1}

function step(){
 if(shake>0)shake*=.82;
 FX=FX.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;return--p.l>0});
 if(phase=='ko'){F.forEach(f=>{f.x+=f.vx;f.vx*=.9;f.y=Math.min(G,f.y+f.vy);f.vy+=.8;if(f.y>G)f.y=G});if(--pt<=0)after();return}
 if(mode=='ai')ai(F[1],F[0],K[1]);
 if(phase=='ready'){K.forEach(k=>k.pa=k.pb=k.ps=0);if(--pt<=0)phase='fight';return}
 upd(F[0],F[1],K[0]);upd(F[1],F[0],K[1]);prj();tm--;
 const dx=F[1].x-F[0].x;if(Math.abs(dx)<36){const s=(36-Math.abs(dx))/2*(dx<0?-1:1);F[0].x-=s;F[1].x+=s}
 if(F[0].hp<=0||F[1].hp<=0||tm<=0){
  const r=F.map(f=>Math.max(0,f.hp)/f.mh);
  wn=r[0]>r[1]?0:r[1]>r[0]?1:-1;
  if(wn>=0)wins[wn]++;if(wn==1)lost=true;
  phase='ko';pt=110}}
function after(){if(wins[0]==2||wins[1]==2)finish();else{round++;newRound()}}
function finish(){
 stop();const w=wins[0]==2?0:1;let t,s;
 if(mode=='ai'){
  if(w==0){const b=Math.round(50*[1,1.5,2][diff]),r=b+(lost?0:20)+cmb*10,p=[b+' за победу'];
   if(!lost)p.push('20 за чистую победу');if(cmb)p.push(cmb*10+' за комбо');
   S.coins+=r;save();t='Победа!';s='Получено '+r+' монет ('+p.join(', ')+')'}
  else{t='Поражение';s='Монеты дают за победу. Попробуй ещё раз!'}}
 else{t='Победил игрок '+(w+1);s='В режиме для двоих монеты не начисляются'}
 $('#rt').textContent=t;$('#rs').textContent=s;show('res')}

/* ---------- рисование ---------- */
function fig(f){
 const d=f.dir,X=f.x,Y=f.y;x.save();
 if(f.gh>0)x.globalAlpha=.4;
 x.fillStyle='#0005';x.beginPath();x.ellipse(X,G+4,26,6,0,0,7);x.fill();
 const dead=phase=='ko'&&f.hp<=0;
 if(dead){x.translate(X,Y);x.rotate(-d*1.3);x.translate(-X,-Y)}
 x.fillStyle='#1b1530';x.fillRect(X-16,Y-34,12,34);x.fillRect(X+4,Y-34,12,34);
 const top=f.bl?-72:-88,bh=f.bl?40:56;
 x.fillStyle=f.hs>0&&f.hs%4<2?'#fff':f.c.c;x.fillRect(X-20,Y+top+4,40,bh);
 x.fillStyle='#f2c9a0';x.beginPath();x.arc(X+d*2,Y+top-8,13,0,7);x.fill();
 x.font='24px serif';x.textAlign='center';x.fillText(f.c.e,X,Y+top+34);
 let len=f.at>0&&f.hf>=0?{l:48,h:62,s:f.c.sk=='reach'?110:62}[f.ak]*(f.at>f.hf-4?1:.5):22;
 x.strokeStyle='#f2c9a0';x.lineWidth=10;x.lineCap='round';
 x.beginPath();x.moveTo(X+d*14,Y+top+16);x.lineTo(X+d*(14+len),Y+top+(f.at>0?14:34));x.stroke();
 if(f.ak=='s'&&f.at>0&&f.c.sk=='reach'){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(X+d*30,Y-80);x.lineTo(X+d*(30+len),Y-60);x.stroke()}
 if(f.bl){x.strokeStyle='#9ef';x.lineWidth=5;x.beginPath();x.arc(X+d*26,Y-50,30,-1.2,1.2);x.stroke()}
 x.restore()}
function draw(){
 const A=[['#2b1b4d','#b04a7a'],['#0f3057','#00909e'],['#3d1f1f','#d9833d']][arena];
 x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const g=x.createLinearGradient(0,0,0,G);g.addColorStop(0,A[0]);g.addColorStop(1,A[1]);
 x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
 x.fillStyle='#fff2';x.beginPath();x.arc(arena*230+190,120,58,0,7);x.fill();
 x.fillStyle='#0003';for(let i=0;i<16;i++){const h=40+((i*37+arena*11)%7)*20;x.fillRect(i*52,G-h,42,h)}
 x.fillStyle='#120b1f';x.fillRect(-10,G,W+20,H);
 x.fillStyle='#ffffff14';x.fillRect(0,G,W,4);
 F.forEach(fig);
 PR.forEach(p=>{x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=14;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0});
 FX.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x,p.y,4,4)});
 x.restore();
 [0,1].forEach(i=>{const f=F[i],p=Math.max(0,f.hp)/f.mh,bw=330,bx=i?W-20-bw:20;
  x.fillStyle='#0008';x.fillRect(bx,16,bw,22);
  x.fillStyle=p>.3?'#4ade80':'#ff4d6d';const w=bw*p;x.fillRect(i?bx+bw-w:bx,16,w,22);
  x.fillStyle='#ffc233';const ew=bw*f.en/100;x.fillRect(i?bx+bw-ew:bx,42,ew,6);
  x.fillStyle='#fff';x.font='16px "Russo One",Impact,sans-serif';x.textAlign=i?'right':'left';x.fillText(f.c.n,i?bx+bw:bx,70);
  for(let r=0;r<2;r++){x.fillStyle=r<wins[i]?'#ffc233':'#fff4';x.beginPath();x.arc(i?bx+bw-8-r*20:bx+8+r*20,88,6,0,7);x.fill()}});
 x.textAlign='center';x.fillStyle='#fff';x.font='28px "Russo One",Impact,sans-serif';x.fillText(Math.ceil(tm/60),W/2,40);
